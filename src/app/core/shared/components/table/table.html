<div class="table-card">
  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <ng-content select="[header]" />
        </tr>
      </thead>
      <tbody>
        @if (empty()) {
          <tr>
            <td class="empty-state" colspan="100">
              {{ loading() ? loadingText() : emptyText() }}
            </td>
          </tr>
        } @else {
          <ng-content select="[body]" />
        }
      </tbody>
    </table>
  </div>

  @if (pagination(); as p) {
    <div class="pagination">
      <span>Página {{ p.page }} de {{ p.pageCount || 1 }} · {{ p.total }} {{ p.itemsLabel ?? 'resultados' }}</span>
      <button type="button" class="pagination-btn" [disabled]="p.page <= 1" (click)="pageChange.emit(p.page - 1)">
        <app-icon name="chevron-left" [size]="14" />
      </button>
      <button
        type="button"
        class="pagination-btn"
        [disabled]="p.page >= p.pageCount"
        (click)="pageChange.emit(p.page + 1)"
      >
        <app-icon name="chevron-left" [size]="14" style="transform: rotate(180deg)" />
      </button>
    </div>
  }
</div>
