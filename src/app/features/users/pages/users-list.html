<app-toolbar>
  <app-search-box placeholder="Buscar usuarios..." [value]="search()" (valueChange)="onSearch($event)" />

  <label class="checkbox-label">
    <input type="checkbox" [checked]="deleted()" (change)="deleted.set($event.target.checked)" />
    Mostrar eliminados
  </label>

  <app-button toolbarActions variant="primary" (clicked)="openCreate()">
    <app-icon name="plus" [size]="16" />
    Nuevo usuario
  </app-button>
</app-toolbar>

<app-table [columns]="columns" [data]="users()" [loading]="usersQuery.isLoading()"
  emptyText="No se encontraron usuarios." [pagination]="pagination()" (pageChange)="goToPage($event)">
  <ng-template appTableCell="status" let-record>
    @if (record.deletedAt) {
    <app-badge variant="neutral">Eliminado</app-badge>
    } @else if (record.blocked) {
    <app-badge variant="danger">Bloqueado</app-badge>
    } @else {
    <app-badge variant="success">Activo</app-badge>
    }
  </ng-template>

  <ng-template appTableCell="actions" let-record>
    <div class="row-actions">
      @if (record.deletedAt) {
      <app-button variant="icon-success" tooltip="Restaurar" (clicked)="restore(record)">
        <app-icon name="restore" [size]="15" />
      </app-button>
      } @else {
      <app-button variant="icon" tooltip="Editar" (clicked)="openEdit(record)">
        <app-icon name="edit" [size]="15" />
      </app-button>
      <app-button variant="icon-danger" tooltip="Eliminar" (clicked)="remove(record)">
        <app-icon name="trash" [size]="15" />
      </app-button>
      }
    </div>
  </ng-template>
</app-table>

<app-modal [open]="modalOpen()" [title]="editingId() ? 'Editar usuario' : 'Nuevo usuario'" (closed)="closeModal()">
  <app-user-form [userId]="editingId()" (saved)="onFormSaved()" (cancelled)="closeModal()" />
</app-modal>
