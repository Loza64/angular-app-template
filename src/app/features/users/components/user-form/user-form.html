<form class="form-grid" [formGroup]="form" (ngSubmit)="submit()">
  @if (loadingEdit()) {
  <div class="form-loading-state">Cargando datos del usuario...</div>
  } @else {
  <app-form-field
    label="Usuario"
    for="username"
    [error]="form.get('username')?.invalid && form.get('username')?.touched ? 'El usuario es obligatorio.' : ''"
  >
    <input id="username" class="field-input" type="text" formControlName="username" required />
  </app-form-field>

  <app-form-field label="Nombre" for="name">
    <input id="name" class="field-input" type="text" formControlName="name" />
  </app-form-field>

  <app-form-field
    label="Apellido"
    for="surname"
    [error]="form.get('surname')?.invalid && form.get('surname')?.touched ? 'El apellido es obligatorio.' : ''"
  >
    <input id="surname" class="field-input" type="text" formControlName="surname" required />
  </app-form-field>

  <app-form-field
    label="Email"
    for="email"
    [error]="form.get('email')?.invalid && form.get('email')?.touched ? 'Ingresa un email válido.' : ''"
  >
    <input id="email" class="field-input" type="email" formControlName="email" required />
  </app-form-field>

  @if (!userId()) {
  <app-form-field
    label="Contraseña"
    for="password"
    [error]="form.get('password')?.invalid && form.get('password')?.touched ? 'La contraseña es obligatoria.' : ''"
  >
    <input id="password" class="field-input" type="password" formControlName="password" required />
  </app-form-field>
  }

  <app-form-field label="Rol">
    <app-select-api [service]="roleService" queryKey="roles-select" [value]="form.get('role')?.value"
      (valueChange)="onRoleChange($event)" placeholder="Selecciona un rol" />
  </app-form-field>

  @if(userId()){
  <label class="form-toggle">
    <input type="checkbox" formControlName="blocked" />
    Usuario bloqueado
  </label>
  }
  }

  @if (formError()) {
  <span class="form-error">{{ formError() }}</span>
  }

  <div class="form-actions">
    <app-button variant="ghost" (clicked)="cancel()">Cancelar</app-button>
    <app-button type="submit" variant="primary" [disabled]="saving() || form.invalid || loadingEdit()">
      {{ saving() ? 'Guardando...' : 'Guardar' }}
    </app-button>
  </div>
</form>
