<div class="toolbar">
  <div class="search-box">
    <app-icon name="search" [size]="16" />
    <input type="text" placeholder="Buscar roles..." [value]="search()" (input)="onSearch($event.target.value)" />
  </div>

  <label class="checkbox-label">
    <input type="checkbox" [checked]="deleted()" (change)="deleted.set($event.target.checked)" />
    Mostrar eliminados
  </label>

  <span class="toolbar-spacer"></span>

  <button type="button" class="btn btn-primary" (click)="openCreate()">
    <app-icon name="plus" [size]="16" />
    Nuevo rol
  </button>
</div>

<app-table [columns]="columns" [data]="roles()" [loading]="rolesQuery.isLoading()"
  emptyText="No se encontraron roles." [pagination]="pagination()" (pageChange)="goToPage($event)">
  <ng-template appTableCell="status" let-record>
    @if (record.deletedAt) {
    <span class="badge badge-neutral">Eliminado</span>
    } @else if (record.active) {
    <span class="badge badge-success">Activo</span>
    } @else {
    <span class="badge badge-danger">Inactivo</span>
    }
  </ng-template>

  <ng-template appTableCell="actions" let-record>
    <div class="row-actions">
      @if (record.deletedAt) {
      <button type="button" class="icon-btn icon-btn-success" (click)="restore(record)" title="Restaurar">
        <app-icon name="restore" [size]="15" />
      </button>
      } @else {
      <button type="button" class="icon-btn" (click)="openEdit(record)" title="Editar">
        <app-icon name="edit" [size]="15" />
      </button>
      <button type="button" class="icon-btn icon-btn-danger" (click)="remove(record)" title="Eliminar">
        <app-icon name="trash" [size]="15" />
      </button>
      }
    </div>
  </ng-template>
</app-table>

<app-modal [open]="modalOpen()" [title]="editingId() ? 'Editar rol' : 'Nuevo rol'" (closed)="closeModal()">
  <app-role-form [roleId]="editingId()" (saved)="onFormSaved()" (cancelled)="closeModal()" />
</app-modal>
