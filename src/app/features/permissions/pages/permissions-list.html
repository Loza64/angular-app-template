<div class="page">
  <div class="toolbar">
    <div class="search-box">
      <app-icon name="search" [size]="16" />
      <input type="text" placeholder="Buscar permisos..." [value]="search()" (input)="onSearch($event.target.value)" />
    </div>
    <span class="toolbar-spacer"></span>
    <span class="hint">Los permisos se generan automáticamente a partir de los endpoints del backend.</span>
  </div>

  <app-table [columns]="columns" [data]="permissions()" [loading]="permissionsQuery.isLoading()" [rowKey]="'id'"
    emptyText="No se encontraron permisos." [pagination]="pagination()" (pageChange)="goToPage($event)">
    <ng-template appTableCell="method" let-record>
      <span class="badge badge-neutral">{{ record.method }}</span>
    </ng-template>

    <ng-template appTableCell="actions" let-record>
      <div class="row-actions">
        <button type="button" class="icon-btn" (click)="openEdit(record)" title="Editar título">
          <app-icon name="edit" [size]="15" />
        </button>
      </div>
    </ng-template>
  </app-table>
</div>

<app-modal [open]="modalOpen()" [title]="'Editar permiso'" (closed)="closeModal()">
  <app-permission-form [permission]="editingPermission()" (saved)="onFormSaved()" (cancelled)="closeModal()" />
</app-modal>
