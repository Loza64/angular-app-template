<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="auth-brand-mark">A</span>
      <span class="auth-brand-name">Admin Panel</span>
    </div>

    <h1 class="auth-title">Crea tu cuenta</h1>
    <p class="auth-subtitle">Completa tus datos para registrarte</p>

    <form class="form-grid" [formGroup]="form" (ngSubmit)="submit()">
      <app-form-field
        label="Usuario"
        for="username"
        [error]="form.get('username')?.invalid && form.get('username')?.touched ? 'El usuario es obligatorio.' : ''"
      >
        <input id="username" class="field-input" type="text" formControlName="username" autocomplete="username" required />
      </app-form-field>

      <div class="auth-row">
        <app-form-field
          label="Nombre"
          for="name"
          [error]="form.get('name')?.invalid && form.get('name')?.touched ? 'El nombre es obligatorio.' : ''"
        >
          <input id="name" class="field-input" type="text" formControlName="name" autocomplete="given-name" required />
        </app-form-field>

        <app-form-field
          label="Apellido"
          for="surname"
          [error]="form.get('surname')?.invalid && form.get('surname')?.touched ? 'El apellido es obligatorio.' : ''"
        >
          <input id="surname" class="field-input" type="text" formControlName="surname" autocomplete="family-name" required />
        </app-form-field>
      </div>

      <app-form-field
        label="Email"
        for="email"
        [error]="form.get('email')?.invalid && form.get('email')?.touched ? 'Ingresa un email válido.' : ''"
      >
        <input id="email" class="field-input" type="email" formControlName="email" autocomplete="email" required />
      </app-form-field>

      <app-form-field
        label="Contraseña"
        for="password"
        hint="Mínimo 8 caracteres"
        [error]="form.get('password')?.invalid && form.get('password')?.touched ? 'La contraseña debe tener al menos 8 caracteres.' : ''"
      >
        <input id="password" class="field-input" type="password" formControlName="password" autocomplete="new-password" required />
      </app-form-field>

      <app-form-field
        label="Confirmar contraseña"
        for="confirmPassword"
        [error]="form.errors?.['passwordMismatch'] && form.get('confirmPassword')?.touched ? 'Las contraseñas no coinciden.' : ''"
      >
        <input id="confirmPassword" class="field-input" type="password" formControlName="confirmPassword" autocomplete="new-password" required />
      </app-form-field>

      @if (error()) {
        <span class="form-error">{{ error() }}</span>
      }

      <app-button type="submit" variant="primary" [fullWidth]="true" [disabled]="loading() || form.invalid">
        {{ loading() ? 'Creando cuenta...' : 'Crear cuenta' }}
      </app-button>
    </form>

    <p class="auth-footer">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </div>
</div>
