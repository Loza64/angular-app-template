<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="auth-brand-mark">A</span>
      <span class="auth-brand-name">Admin Panel</span>
    </div>

    <h1 class="auth-title">Crea tu cuenta</h1>
    <p class="auth-subtitle">Completa tus datos para registrarte</p>

    <form class="form-grid" (ngSubmit)="submit()">
      <div class="form-field">
        <label for="username">Usuario</label>
        <input
          id="username"
          type="text"
          [ngModel]="form().username"
          (ngModelChange)="updateForm('username', $event)"
          name="username"
          autocomplete="username"
          required
        />
      </div>

      <div class="auth-row">
        <div class="form-field">
          <label for="name">Nombre</label>
          <input
            id="name"
            type="text"
            [ngModel]="form().name"
            (ngModelChange)="updateForm('name', $event)"
            name="name"
            autocomplete="given-name"
            required
          />
        </div>

        <div class="form-field">
          <label for="surname">Apellido</label>
          <input
            id="surname"
            type="text"
            [ngModel]="form().surname"
            (ngModelChange)="updateForm('surname', $event)"
            name="surname"
            autocomplete="family-name"
            required
          />
        </div>
      </div>

      <div class="form-field">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          [ngModel]="form().email"
          (ngModelChange)="updateForm('email', $event)"
          name="email"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          [ngModel]="form().password"
          (ngModelChange)="updateForm('password', $event)"
          name="password"
          autocomplete="new-password"
          required
        />
        <span class="hint">Mínimo 8 caracteres</span>
      </div>

      <div class="form-field">
        <label for="confirmPassword">Confirmar contraseña</label>
        <input
          id="confirmPassword"
          type="password"
          [ngModel]="form().confirmPassword"
          (ngModelChange)="updateForm('confirmPassword', $event)"
          name="confirmPassword"
          autocomplete="new-password"
          required
        />
      </div>

      @if (error()) {
        <span class="form-error">{{ error() }}</span>
      }

      <button type="submit" class="btn btn-primary auth-submit" [disabled]="loading()">
        {{ loading() ? 'Creando cuenta...' : 'Crear cuenta' }}
      </button>
    </form>

    <p class="auth-footer">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </div>
</div>
