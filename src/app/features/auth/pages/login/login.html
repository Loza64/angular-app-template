<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="auth-brand-mark">A</span>
      <span class="auth-brand-name">Admin Panel</span>
    </div>

    <h1 class="auth-title">Inicia sesión</h1>
    <p class="auth-subtitle">Ingresa tus credenciales para continuar</p>

    <form class="form-grid" [formGroup]="form" (ngSubmit)="submit()">
      <app-form-field
        label="Usuario"
        for="username"
        [error]="form.get('username')?.invalid && form.get('username')?.touched ? 'El usuario es obligatorio.' : ''"
      >
        <input id="username" class="field-input" type="text" formControlName="username" autocomplete="username" required />
      </app-form-field>

      <app-form-field
        label="Contraseña"
        for="password"
        [error]="form.get('password')?.invalid && form.get('password')?.touched ? 'La contraseña es obligatoria.' : ''"
      >
        <input id="password" class="field-input" type="password" formControlName="password" autocomplete="current-password" required />
      </app-form-field>

      @if (error()) {
        <span class="form-error">{{ error() }}</span>
      }

      <app-button type="submit" variant="primary" [fullWidth]="true" [disabled]="loading() || form.invalid">
        {{ loading() ? 'Ingresando...' : 'Ingresar' }}
      </app-button>
    </form>

    <p class="auth-footer">¿No tienes cuenta? <a routerLink="/signup">Crear cuenta</a></p>
  </div>
</div>
